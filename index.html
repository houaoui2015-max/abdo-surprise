<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abdo surprise 💘</title>

  <style>
    :root{
      --pink:#ff2d6d;
      --card: rgba(0,0,0,.55);
      --stroke: rgba(255,255,255,.18);
      --txt: rgba(255,255,255,.95);
      --muted: rgba(255,255,255,.78);
      --shadow: 0 22px 70px rgba(0,0,0,.45);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--txt);
      overflow:hidden;
      background:
        radial-gradient(circle at top left, rgba(255,45,109,.30), transparent 55%),
        radial-gradient(circle at bottom right, rgba(255,255,255,.08), transparent 60%),
        #0b0b10;
    }

    /* floating hearts */
    .hearts{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:1;
    }
    .heart{
      position:absolute;
      font-size:22px;
      opacity:.75;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
    }
    @keyframes floatUp{
      from{ transform: translateY(110vh) translateX(0) rotate(0deg); }
      to{ transform: translateY(-20vh) translateX(40px) rotate(360deg); }
    }

    .wrap{
      position:relative;
      z-index:2;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }

    .card{
      width:min(540px, 94vw);
      background:var(--card);
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      border-radius:22px;
      padding:22px;
      backdrop-filter: blur(10px);
      text-align:center;
    }

    .tag{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.20);
      background: rgba(255,255,255,.10);
      font-size:12px;
      margin-bottom:12px;
    }

    h1{
      margin:0 0 8px;
      font-size:28px;
      letter-spacing:.2px;
    }

    p{
      margin:0 0 16px;
      color:var(--muted);
      line-height:1.4;
      font-size:15px;
    }

    .question{
      font-size:18px;
      margin:14px 0 14px;
      color:var(--txt);
      font-weight:700;
    }

    .btns{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:10px;
      position:relative;
    }

    button{
      border:none;
      cursor:pointer;
      padding:12px 18px;
      border-radius:14px;
      font-weight:700;
      font-size:15px;
      transition: transform .12s ease, opacity .12s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      user-select:none;
    }
    button:active{ transform: scale(.97); }

    .primary{
      background: var(--pink);
      color:white;
    }

    .secondary{
      background: rgba(255,255,255,.16);
      color:white;
      border:1px solid rgba(255,255,255,.20);
    }

    .tiny{
      margin-top:12px;
      font-size:12px;
      opacity:.85;
    }

    /* moving NO button */
    #noBtn{
      position:relative;
    }

    .success{
      display:none;
      margin-top:16px;
      padding:16px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(255,45,109,.14);
      animation: pop .35s ease;
    }

    @keyframes pop{
      from{ transform: scale(.95); opacity:0; }
      to{ transform: scale(1); opacity:1; }
    }

    .success h2{
      margin:0 0 6px;
      font-size:22px;
    }

    .success p{
      margin:0;
      font-size:14px;
      color:rgba(255,255,255,.88);
      line-height:1.5;
    }

    /* Photo appears only after YES */
    .photoWrap{
      display:none;
      margin-top:14px;
      animation: pop .45s ease;
    }

    .photoWrap img{
      width:min(320px, 78vw);
      border-radius:18px;
      border:1px solid rgba(255,255,255,.18);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    .celebrate{
      display:none;
      margin-top:10px;
      font-size:22px;
      letter-spacing:2px;
      animation: pop .45s ease;
    }
  </style>
</head>

<body>
  <div class="hearts" id="hearts"></div>

  <div class="wrap">
    <div class="card">
      <div class="tag">From Abdo 💘</div>

      <h1>Hey Kbida dyali 😍</h1>
      <p>I made a little surprise just for you ✨</p>

      <!-- STEP 1 -->
      <div id="step1">
        <div class="question">Wash katbghini bzzf wla shwiya? 😏</div>
        <div class="btns">
          <button class="primary" onclick="chooseLove('BZZF 😍💘')">Bzzf 💖</button>
          <button class="secondary" onclick="chooseLove('SHWIYA 😌💗')">Shwiya 🤭</button>
        </div>
        <div class="tiny">Choose honestly 😄</div>
      </div>

      <!-- STEP 2 -->
      <div id="step2" style="display:none;">
        <div class="question">Will you be my Valentine? 💝</div>

        <div class="btns">
          <button class="primary" id="yesBtn">Yes 💘</button>
          <button class="secondary" id="noBtn">No 🙈</button>
        </div>

        <div class="tiny" id="loveAnswerText"></div>

        <!-- SUCCESS -->
        <div class="success" id="successBox">
          <h2>YAAAAY 💖💘</h2>
          <p>
            You just made my whole day, <b>Kbida dyali</b> 😍<br/>
            I promise I’ll make this Valentine’s special ✨🍰💝
          </p>

          <div class="celebrate" id="celebrate">
            🎉🎊🥳💘✨🎉🎊
          </div>

          <div class="photoWrap" id="photoWrap">
            <img src="photo.jpeg" alt="Our photo" />
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Floating hearts
    const heartsWrap = document.getElementById("hearts");
    const heartEmojis = ["💘","💖","💗","💞","💕","😍","✨"];
    for(let i=0;i<18;i++){
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
      h.style.left = Math.random()*100 + "vw";
      h.style.animationDuration = (6 + Math.random()*6) + "s";
      h.style.animationDelay = (-Math.random()*10) + "s";
      h.style.fontSize = (16 + Math.random()*18) + "px";
      heartsWrap.appendChild(h);
    }

    let loveChoice = "";

    function chooseLove(choice){
      loveChoice = choice;

      document.getElementById("step1").style.display = "none";
      document.getElementById("step2").style.display = "block";

      document.getElementById("loveAnswerText").innerHTML =
        "You chose: <b>" + loveChoice + "</b> 😍";
    }

    // Moving NO button
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("click", moveNo);
    noBtn.addEventListener("touchstart", moveNo);

    function moveNo(){
      const maxX = 220;
      const maxY = 120;
      const x = (Math.random() * maxX) - (maxX/2);
      const y = (Math.random() * maxY) - (maxY/2);
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    // YES click
    document.getElementById("yesBtn").addEventListener("click", () => {
      document.getElementById("successBox").style.display = "block";
      document.getElementById("celebrate").style.display = "block";
      document.getElementById("photoWrap").style.display = "block";
      noBtn.style.display = "none";
    });
  </script>
</body>
</html>
